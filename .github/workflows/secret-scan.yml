name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base_url}/${archive}"
          curl -fsSLO "${base_url}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          python3 - "${archive}" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" <<'PY'
          import hashlib
          import pathlib
          import sys

          archive = pathlib.Path(sys.argv[1])
          checksums = pathlib.Path(sys.argv[2]).read_text().splitlines()
          expected = next(line.split()[0] for line in checksums if line.split()[-1] == archive.name)
          actual = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit("Gitleaks archive checksum mismatch")
          PY
          tar -xzf "${archive}" gitleaks

      - name: Scan committed history for secrets
        shell: bash
        run: ./gitleaks git --redact=100 --no-banner --log-opts="--all" .
